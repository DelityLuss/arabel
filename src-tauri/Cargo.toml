[package]
name = "arabel"
version = "0.3.0"
description = "Terminal SSH pour piloter des agents IA"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "arabel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.62.2"
tokio = { version = "1.52.3", features = ["full"] }
base64 = "0.22.1"
# Coffre local chiffré pour les passphrases/mots de passe (voir store.rs) : clé
# aléatoire par installation, AEAD ChaCha20-Poly1305. Remplace le trousseau OS
# (keyring) qui, sur macOS non signé, redemandait le mot de passe à chaque lancement.
chacha20poly1305 = "0.10"
getrandom = "0.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-window-state = "2.4.1"
portable-pty = "0.9.0"
sysinfo = "0.39.6"
russh-sftp = "2.3.0"
# Énumération des fontes système sur macOS (Core Text), Windows (DirectWrite) et Linux.
font-kit = "0.14"
# Résolution cross-platform du home / Downloads (HOME sur Unix, %USERPROFILE% sur Windows).
dirs = "5"

# Build release optimisé : LTO complet + un seul codegen-unit = meilleur inlining
# à travers les crates (crypto russh, tokio, parseur xterm côté natif). strip = binaire plus léger.
[profile.release]
lto = true
codegen-units = 1
strip = true

# Les dépendances sont compilées en -O3 même en dev (crypto/SSH réactif dès
# `tauri dev`) sans ralentir les rebuilds incrémentaux du code de l'app.
[profile.dev.package."*"]
opt-level = 3

