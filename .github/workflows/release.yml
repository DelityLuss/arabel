name: release

# Un tag `v*` poussé déclenche le build sur les 3 OS et crée la release GitHub
# avec les artefacts (.dmg/.app universel macOS, .msi/.exe Windows, .deb/.AppImage Linux).
# Commande unique côté dev :  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write # tauri-action crée la release et y attache les binaires
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon SEUL, et c'est Parakeet qui l'impose : ort ne publie
          # pas d'ONNX Runtime prébuilt pour x86_64-apple-darwin, donc un
          # binaire universel ne peut pas embarquer la dictée Parakeet. Choix
          # assumé — les Mac Intel n'ont plus de build.
          - platform: macos-latest
            args: --target aarch64-apple-darwin --features local-parakeet
          # Pas de Parakeet ici : le prébuilt ort est compilé contre glibc ≥ 2.38
          # et la libstdc++ de GCC 13, que ce runner n'a pas (symboles
          # __isoc23_strtol, _M_replace_cold introuvables au lien). Rester en
          # 22.04 garde le .deb/.AppImage lançables sur les distros courantes.
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: --features local-parakeet
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système Linux (WebKitGTK, etc.)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev # cpal/ALSA : le micro de la dictée

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      - name: whisper.cpp Linux — bindings glibc pré-générées (bindgen indisponible/inutile)
        # whisper-rs-sys teste juste la PRÉSENCE de la variable
        # (env::var(...).is_ok()), pas sa valeur : elle doit être absente sur
        # macOS/Windows, où les bindings glibc pré-générées ne correspondent
        # pas au vrai libc et cassent la build (tailles de _IO_FILE fausses).
        # bindgen y régénère depuis les vrais en-têtes de l'OS.
        if: matrix.platform == 'ubuntu-22.04'
        run: echo "WHISPER_DONT_GENERATE_BINDINGS=1" >> "$GITHUB_ENV"

      - name: Windows — build whisper.cpp portable (pas optimisé pour le CPU du runner)
        # Par défaut GGML_NATIVE=ON : whisper.cpp se compile pour les instructions
        # du CPU de CE runner GitHub (AVX2/FMA...), pas celui de la machine qui
        # exécutera le binaire. Un CPU utilisateur sans AVX2 (ou une VM/sandbox où
        # Windows le masque, cas fréquent) plante avec une instruction illégale —
        # pas une erreur Rust récupérable, tout le process meurt. Ça arrive pile
        # au premier calcul, donc au lancement de la transcription, jamais pendant
        # la capture micro (cpal, indépendant de whisper.cpp). whisper-rs-sys
        # relaie tout env var GGML_* vers CMake, d'où ce garde-fou par variable
        # d'environnement plutôt qu'un patch. On garde AVX (universel depuis 2011)
        # et coupe seulement AVX2/FMA/F16C, la vraie zone à risque.
        if: matrix.platform == 'windows-latest'
        run: |
          echo "GGML_NATIVE=OFF" >> "$GITHUB_ENV"
          echo "GGML_AVX2=OFF" >> "$GITHUB_ENV"

      - name: macOS — lier libclang_rt.osx (ggml-metal utilise @available, symbole absent du rustc de ce runner)
        # Le backend Metal de ggml (Objective-C) insère des appels à
        # ___isPlatformVersionAtLeast pour ses checks @available(...). std les
        # fournit depuis peu, mais tant que le stable du runner n'a pas ce
        # correctif le lien échoue ("symbol(s) not found"). Fix connu :
        # lier explicitement libclang_rt.osx.a, le runtime clang qui le fournit.
        if: matrix.platform == 'macos-latest'
        run: |
          RT=$(xcrun --sdk macosx clang -print-file-name=libclang_rt.osx.a)
          echo "RUSTFLAGS=-C link-arg=$RT" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Arabel ${{ github.ref_name }}
          releaseDraft: true # release en brouillon : tu la publies en un clic après vérif
          prerelease: false
          args: ${{ matrix.args }}
